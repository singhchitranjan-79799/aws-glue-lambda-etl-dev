name: Deploy to AWS

on:
  push:
    branches:
      - aws-glue-lambda-etl1.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install boto3 awsglue
      
      # 4. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      # 5. Upload Glue code to S3
      - name: Upload Glue code to S3
        run: |
          aws s3 cp glue_etl_code/glue.py s3://${{ secrets.AWS_GLUE_SCRIPTS_BUCKET }}/glue_scripts/glue.py
      
      # 6. Upload Lambda code to S3
      - name: Upload Lambda code to S3
        run: |
          cd lambda_file_check
          pip install -r requirements.txt -t .
          zip -r lambda_function.zip .
          aws s3 cp lambda_function.zip s3://${{ secrets.AWS_GLUE_SCRIPTS_BUCKET }}/lambda_functions/lambda_function.zip
      
      # 7. Update Lambda function code
      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name s3_file_format_check \
            --s3-bucket ${{ secrets.AWS_GLUE_SCRIPTS_BUCKET }} \
            --s3-key lambda_functions/lambda_function.zip \
            --region ${{ secrets.AWS_REGION }}
      
      # 8. Optional: Update Glue Job if exists
      - name: Update Glue Job (Optional)
        run: |
          aws glue update-job \
            --name incre_data_testing \
            --role arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GlueServiceRole \
            --command Name=glueetl,ScriptLocation=s3://${{ secrets.AWS_GLUE_SCRIPTS_BUCKET }}/glue_scripts/glue.py \
            --region ${{ secrets.AWS_REGION }} || true
      
      # 9. Print deployment summary
      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo "Glue Script: s3://${{ secrets.AWS_GLUE_SCRIPTS_BUCKET }}/glue_scripts/glue.py"
          echo "Lambda Package: s3://${{ secrets.AWS_GLUE_SCRIPTS_BUCKET }}/lambda_functions/lambda_function.zip"
